<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRM ULTIMATE PANEL ⚡</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #090d16; color: #f8fafc; padding: 15px; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; background: #111827; padding: 25px; border-radius: 16px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
        .header h1 { color: #22c55e; font-size: 26px; text-shadow: 0 0 10px rgba(34, 197, 94, 0.3); }
        .header p { color: #64748b; font-size: 13px; margin-top: 5px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 25px; }
        .stat-card { background: #1e293b; padding: 15px; border-radius: 10px; border-right: 4px solid #22c55e; text-align: center; }
        .stat-card h4 { font-size: 12px; color: #94a3b8; }
        .stat-card div { font-size: 20px; font-weight: bold; color: #38bdf8; margin-top: 5px; }
        .card { background: #162032; padding: 20px; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 20px; }
        .card-title { font-size: 16px; color: #38bdf8; margin-bottom: 15px; font-weight: bold; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0b1120; color: #fff; font-size: 13px; outline: none; transition: 0.2s; }
        input:focus, select:focus { border-color: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.3); }
        .btn { padding: 10px 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-add { background: #22c55e; color: #052e16; width: 100%; grid-column: 1 / -1; font-size: 15px; padding: 12px; margin-top: 5px; }
        .btn-add:hover { background: #16a34a; color: #fff; box-shadow: 0 0 12px rgba(34,197,94,0.4); }
        .btn-qr { background: #f59e0b; color: #000; }
        .btn-copy { background: #06b6d4; color: #fff; }
        .btn-edit { background: #3b82f6; color: #fff; }
        .btn-del { background: #ef4444; color: #fff; }
        .btn-renew { background: #a855f7; color: #fff; }
        .search-box { margin-bottom: 15px; }
        .table-responsive { overflow-x: auto; border-radius: 10px; border: 1px solid #1e293b; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; text-align: center; }
        th, td { border-bottom: 1px solid #1e293b; padding: 12px; font-size: 13px; }
        th { background: #0b1120; color: #22c55e; font-weight: bold; }
        tr:hover { background: #1e293b55; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .badge-active { background: #22c55e22; color: #22c55e; border: 1px solid #22c55e; }
        .badge-port { background: #38bdf822; color: #38bdf8; border: 1px solid #38bdf8; }
        #qrcodeModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #162032; padding: 25px; border-radius: 16px; text-align: center; max-width: 320px; width: 90%; border: 1px solid #334155; }
        #qrcode { display: flex; justify-content: center; margin: 15px 0; background: #fff; padding: 12px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SRM ULTIMATE PANEL ⚡</h1>
        <p>پنل حرفه‌ای مدیریت و ساخت کانفیگ v2ray</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h4>کل کانفیگ‌ها</h4><div id="statTotal">0</div></div>
        <div class="stat-card"><h4>مجموع حجم تعریف شده</h4><div id="statGB">0 GB</div></div>
        <div class="stat-card"><h4>پورت‌های فعال</h4><div id="statPorts">443, 80, ...</div></div>
    </div>

    <div class="card">
        <div class="card-title">➕ ساخت کانفیگ جدید</div>
        <div class="grid-inputs">
            <input type="text" id="configName" placeholder="نام کاربر / شناسه">
            
            <div style="display:flex; gap:5px;">
                <input type="number" id="configSize" placeholder="حجم">
                <select id="configUnit" style="width:90px;">
                    <option value="GB">GB</option>
                    <option value="MB">MB</option>
                </select>
            </div>

            <input type="number" id="configDays" placeholder="اعتبار (روز)">
            
            <select id="configPort">
                <option value="443">پورت 443 (HTTPS / TLS)</option>
                <option value="80">پورت 80 (HTTP / CDN)</option>
                <option value="2053">پورت 2053 (Cloudflare)</option>
                <option value="2083">پورت 2083 (TLS)</option>
                <option value="2087">پورت 2087 (TLS)</option>
                <option value="8080">پورت 8080 (Alternative HTTP)</option>
                <option value="8880">پورت 8880 (HTTP)</option>
            </select>

            <input type="text" id="configLink" placeholder="لینک کامل کانفیگ (vless:// یا ...)">
            
            <button class="btn btn-add" onclick="addConfig()">+ ثبت و ذخیره کانفیگ</button>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 جستجوی سریع براساس نام یا پورت..." oninput="renderConfigs()">
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>نام کاربر</th>
                    <th>حجم</th>
                    <th>اعتبار</th>
                    <th>پورت</th>
                    <th>وضعیت</th>
                    <th>عملیات مدیریت</th>
                </tr>
            </thead>
            <tbody id="configList"></tbody>
        </table>
    </div>
</div>

<div id="qrcodeModal">
    <div class="modal-content">
        <h3 style="color:#22c55e;">اسکن QR Code</h3>
        <div id="qrcode"></div>
        <button class="btn btn-del" style="width:100%;" onclick="closeQr()">بستن</button>
    </div>
</div>

<script>
let configs = JSON.parse(localStorage.getItem('srm_configs_v3')) || [];

function saveAndRender() {
    localStorage.setItem('srm_configs_v3', JSON.stringify(configs));
    renderConfigs();
}

function renderConfigs() {
    const list = document.getElementById('configList');
    const searchVal = document.getElementById('search').value.toLowerCase();
    list.innerHTML = '';
    
    let totalGB = 0;

    configs.forEach((item, index) => {
        if(item.unit === 'GB') totalGB += parseFloat(item.size || 0);
        if(item.unit === 'MB') totalGB += (parseFloat(item.size || 0) / 1024);

        if(item.name.toLowerCase().includes(searchVal) || item.port.includes(searchVal)) {
            list.innerHTML += `
                <tr>
                    <td><b style="color:#f8fafc;">${item.name}</b></td>
                    <td><span style="color:#38bdf8;">${item.size} ${item.unit}</span></td>
                    <td>${item.days} روز</td>
                    <td><span class="badge badge-port">${item.port}</span></td>
                    <td><span class="badge badge-active">فعال</span></td>
                    <td>
                        <button class="btn btn-copy" onclick="copyLink('${item.link}')">کپی</button>
                        <button class="btn btn-qr" onclick="showQr('${item.link}')">QR</button>
                        <button class="btn btn-renew" onclick="renewDays(${index})">+تمدید</button>
                        <button class="btn btn-edit" onclick="editConfig(${index})">ویرایش</button>
                        <button class="btn btn-del" onclick="deleteConfig(${index})">حذف</button>
                    </td>
                </tr>
            `;
        }
    });

    document.getElementById('statTotal').innerText = configs.length;
    document.getElementById('statGB').innerText = totalGB.toFixed(1) + ' GB';
}

function addConfig() {
    const name = document.getElementById('configName').value;
    const size = document.getElementById('configSize').value;
    const unit = document.getElementById('configUnit').value;
    const days = document.getElementById('configDays').value;
    const port = document.getElementById('configPort').value;
    const link = document.getElementById('configLink').value;
    
    if(!name || !size || !days || !link) return alert('لطفاً همه کادرها رو پر کن!');
    
    configs.push({ name, size, unit, days, port, link });
    
    document.getElementById('configName').value = '';
    document.getElementById('configSize').value = '';
    document.getElementById('configDays').value = '';
    document.getElementById('configLink').value = '';
    saveAndRender();
}

function copyLink(link) {
    navigator.clipboard.writeText(link);
    alert('لینک کانفیگ با موفقیت کپی شد!');
}

function editConfig(index) {
    const item = configs[index];
    const newName = prompt('تغییر نام کاربر / شناسه:', item.name);
    const newSize = prompt(`تغییر حجم (${item.unit}):`, item.size);
    const newDays = prompt('تغییر تعداد روز اعتبار:', item.days);
    const newPort = prompt('تغییر پورت (443, 80, 2053, ...):', item.port);
    const newLink = prompt('تغییر لینک کانفیگ:', item.link);
    
    if(newName && newSize && newDays && newLink) {
        configs[index] = { name: newName, size: newSize, unit: item.unit, days: newDays, port: newPort || item.port, link: newLink };
        saveAndRender();
    }
}

function renewDays(index) {
    const addDays = prompt('چند روز می‌خواهی به اعتبار این کاربر اضافه کنی؟', '30');
    if(addDays && !isNaN(addDays)) {
        configs[index].days = parseInt(configs[index].days) + parseInt(addDays);
        saveAndRender();
        alert('اعتبار با موفقیت تمدید شد!');
    }
}

function deleteConfig(index) {
    if(confirm('آیا از حذف این کاربر مطمئنی؟')) {
        configs.splice(index, 1);
        saveAndRender();
    }
}

function showQr(link) {
    document.getElementById('qrcode').innerHTML = '';
    new QRCode(document.getElementById("qrcode"), { text: link, width: 180, height: 180 });
    document.getElementById('qrcodeModal').style.display = 'flex';
}

function closeQr() {
    document.getElementById('qrcodeModal').style.display = 'none';
}

renderConfigs();
</script>

</body>
</html>
